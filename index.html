  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="Descreva o que está sentindo para saber quais remédios você pode tomar e quais estão disponíveis de graça no SUS." />
    <meta property="og:title" content="Farmácia Clara" />

    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        var savedTheme = localStorage.getItem('farmacia_clara_theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased">

  </body>
